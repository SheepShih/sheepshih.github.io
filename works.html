<style>
  :root { --diner-bg: #DF9079; --paper: #F5E9CA; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--diner-bg);
    font-family: "Bentham", serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* topページのドア画像と同じサイズ・位置の枠(中に「準備中」の店内) */
  .works-frame {
    position: relative;
    width: min(100vw, 430px);
    aspect-ratio: 768 / 1376;
    max-height: 100dvh;
    overflow: hidden;
    cursor: pointer; /* シーン全体をタップでトップへ戻れる(ボタンは非表示) */
  }

  .works-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 切替時の「溶ける」登場エフェクト: 歪ませたシーンがドロッと固まっていく。
     演出中だけ canvas(WebGL)に歪ませた画像を描く。準備ができるまでは薄くして待つ */
  .works-frame.melt-wait { opacity: 0.15; }
  .works-gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }
  .works-frame.melting .works-gl { display: block; }
  .works-frame.melting .works-img { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .works-frame.melt-wait { opacity: 1; }
    .works-scene { transition: none; }
  }

  /* ---------- 回転ダイヤル電話(パスワード入力) ----------
     写真の上に、穴を消した写真の盤(dial-bed)→ 穴の奥の影(dial-shadow、回る)→ 穴の縁(dial-rim、回る)
     → 穴の奥の壁(dial-wall)→ 固定の紙と指止め(dial-top)を重ねる。
     回る部分は works-dial.js が canvas に描く(ブラウザによる見え方の違いをなくすため)。
     位置は写真(1116×2000)に対する割合 */
  /* 電話をタップするとシーン全体がダイヤルを中心に拡大する */
  .works-scene { /* 写真と同じ縦横比の箱。枠が縦に短いとき(スマホで画面の高さが足りないとき)は
                   上下を均等に切る(object-fit: cover と同じ)。ダイヤルの部品は写真に対する割合で置くので、ずれない */
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    aspect-ratio: 768 / 1376;
    margin-top: -89.583%; /* 高さの半分(幅 × 1376/768 ÷ 2) */
    transform-origin: 50% 67.6%;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .works-frame.phone-zoom .works-scene { transform: scale(2.4); }
  .phone-tap { /* 電話全体。拡大前はここのタップで拡大する */
    position: absolute;
    left: 32%;
    top: 60%;
    width: 37%;
    height: 17.5%;
    pointer-events: auto;
    cursor: zoom-in;
  }
  .works-frame.phone-zoom { cursor: zoom-out; }
  .works-frame.phone-zoom .phone-tap { cursor: inherit; }
  .works-frame:not(.phone-zoom) .dial-hit { pointer-events: none; }
  .dial-layer { position: absolute; inset: 0; pointer-events: none; }
  .works-frame.melt-wait .dial-layer,
  .works-frame.melting .dial-layer { visibility: hidden; }
  .works-frame.melt-wait .phone-tap,
  .works-frame.melting .phone-tap { visibility: visible; } /* 登場のエフェクト中でも電話はタップできる */
  .dial-box {
    position: absolute;
    left: 43.548%;
    top: 67.75%;
    width: 14.337%;
    aspect-ratio: 1;
    transform: translateY(-50%);
  }
  .dial-canvas { /* 回る部分(影・穴の縁・穴の奥の壁)は works-dial.js が描く */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .dial-bed {
    position: absolute;
    left: 42.115%;
    top: 64.5%;
    width: 17.204%;
    height: 6.5%;
  }
  .dial-top {
    position: absolute;
    left: 37.63%;
    top: 63%;
    width: 26.88%;
    height: 12%;
  }
  .dial-dots { /* 中央の紙に、入力した桁数を表示 */
    position: absolute;
    left: 50.78%;
    top: 67.41%;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: repeat(4, 3px); /* 2行に並べる */
    gap: 1px;
    opacity: 0; /* 電話を拡大してから出す */
    transition: opacity 0.3s ease 0.2s;
  }
  .works-frame.phone-zoom .dial-dots { opacity: 1; }
  .dial-dots i {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(90, 25, 15, 0.22);
  }
  .dial-dots i.on { background: #8c1d14; }
  .dial-hit { /* 指で触れる範囲 */
    position: absolute;
    left: 37%;
    top: 61.5%;
    width: 27%;
    height: 12.5%;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  .works-frame.dial-grabbing .dial-hit { cursor: grabbing; }
  /* 正解すると店内(Works 2022~)に切り替わる。画像は暗号化された中身(#worksSecret)に入っている */
  #worksSecret { display: none; }
  .works-frame.opened .dial-layer { display: none; }
  .works-frame.opened .works-scene { transform: none; transition: none; }
  /* 店内では、画像も私書箱の部品も、写真(1116×2000)と同じ縦横比の箱に上から合わせて置く。
     枠と写真の縦横比がわずかに違うので、object-fit の中央合わせのままだと部品と1pxほどずれる */
  .works-frame.opened .works-img { object-position: 50% 0; }
  .works-frame.opened { cursor: default; } /* 店内ではトップへ戻らない */

  /* 店内の、鍵の掛かった私書箱。タップで鍵が回り、扉が手前へ開いて、開いたデザイン(node 365-240)の形で止まる。
     回るのはオレンジの縁取りの内側の板だけ(縁取りは棚のもの)。板は写真のカメラから見た 3D の回転で JS が動かし(射影変換)、
     開き切ると開いたデザインの扉とぴったり重なる。
     90度までは閉じた扉の表(鍵と札つき)、そこからは開いたデザインの扉(裏・札つき)を同じ四隅に貼る。
     画像はすべて暗号化された中身に入っている。位置は下の LOCKERS */
  .locker-layer { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1116 / 2000; display: none; }
  .locker-clean { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .locker-layer { container-type: inline-size; } /* メニューの文字を店内の画像の幅に合わせて縮める(cqw) */
  /* カウンターのサービスベル。押すとつまみが沈んで光り、「チーン」と鳴って、トップへ戻るメニューが出る(Figma node 380-196) */
  .service-bell {
    position: absolute;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .service-bell:focus-visible { outline: 2px solid #fff6dc; outline-offset: 2px; }
  .bell-menu {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(223, 144, 121, 0.25);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
    cursor: default;
  }
  .bell-menu.show { opacity: 1; visibility: visible; transition: opacity 0.3s ease; }
  .bell-menu-link { /* Figma: Bentham 28px 白、左 97px・上 384px(画像 402×720 の中) */
    position: absolute;
    left: 24.13%;
    top: 53.33%;
    font-family: "Bentham", serif;
    font-size: 6.965cqw;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 0.995cqw rgba(148, 43, 13, 0.5);
    text-decoration: none;
    white-space: nowrap;
  }
  .bell-menu.show .bell-menu-link { animation: bell-menu-in 0.35s ease-out; }
  @keyframes bell-menu-in { from { transform: translateY(0.8cqw); } to { transform: none; } }
  .works-frame.opened .locker-layer { display: block; }
  .works-frame.melt-wait .locker-layer,
  .works-frame.melting .locker-layer { visibility: hidden; }
  .locker {
    position: absolute;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .locker.open, .locker.moving { z-index: 1; }
  /* 閉じて止まっている間は部品を出さず、店内の画像そのものを見せる(部品とのわずかなずれが見えないように) */
  .locker:not(.open):not(.moving) .locker-px { visibility: hidden; }
  .locker:focus-visible { outline: 2px solid #fff6dc; outline-offset: 2px; }
  .locker span, .locker img { position: absolute; display: block; }
  .locker img { width: 100%; height: 100%; pointer-events: none; }
  .locker-px { left: 0; top: 0; transform-origin: 0 0; } /* 中身は写真の px で置き、箱の大きさに合わせて縮める */
  .locker-front, .locker-back { left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .locker-back { visibility: hidden; }
  .locker-under, .locker-wallshadow, .locker-hang { visibility: hidden; pointer-events: none; }
  .locker.open .locker-back { pointer-events: auto; } /* 開いた扉をタップしても閉じる */
  .locker-edge { /* 扉の厚み(開く側の縁)。真横を向くほど太く見える */
    left: 0;
    top: 0;
    width: 10px;
    height: 100px;
    transform-origin: 0 0;
    background: linear-gradient(90deg, #d8c4a6, #efe2cc 45%, #cdb594);
    box-shadow: inset 0 0 0 0.5px rgba(150, 105, 70, 0.4);
    visibility: hidden;
    pointer-events: none;
  }
  .locker-panel { inset: 0; }
  .locker .locker-label { /* 名札の番号。扉と一緒に回る(閉じて止まっている間はキャンバスに描く) */
    width: 0;
    height: 0;
    font: 400 19.43px Bentham, serif;
    color: #bf603c;
    line-height: 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .locker-key { transition: transform 0.24s ease-in-out; }
  .locker-tag, .locker-tag > span { inset: 0; }
  .locker.jolt .locker-tag { animation: tag-jolt 0.9s ease-out; }               /* 鍵を回したとき、輪がねじれて札がくるっと揺れる */
  .locker.swing-open .locker-tag > span { animation: tag-open 0.3s linear forwards; }   /* 扉が動き出すと遅れて浮く */
  .locker.swing-close .locker-tag > span { animation: tag-close 1.1s linear; }  /* 閉じる勢いで浮いて、当たって跳ねる */
  @keyframes tag-jolt {
    0% { transform: rotate(0); }
    20% { transform: rotate(-11deg); }
    45% { transform: rotate(7deg); }
    70% { transform: rotate(-3deg); }
    100% { transform: rotate(0); }
  }
  /* 札が扉から浮く動き(手前へ傾く)は、縦に縮めて表す */
  @keyframes tag-open {
    0% { transform: rotate(0) scaleY(1); }
    40% { transform: rotate(6deg) scaleY(0.86); }
    100% { transform: rotate(10deg) scaleY(0.78); }
  }
  @keyframes tag-close {
    0% { transform: rotate(8deg) scaleY(0.8); animation-timing-function: ease-in; }
    45% { transform: rotate(-3deg) scaleY(1); animation-timing-function: ease-out; }
    60% { transform: rotate(3deg) scaleY(0.88); animation-timing-function: ease-in; }
    75% { transform: rotate(-1.5deg) scaleY(1); animation-timing-function: ease-out; }
    87% { transform: rotate(1deg) scaleY(0.96); }
    100% { transform: rotate(0) scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .locker-key { transition: none !important; }
    .locker .locker-tag, .locker .locker-tag > span { animation: none !important; }
  }
  /* ---------- ケーススタディ(Figma node 394-344) ----------
     開いた私書箱の中をタップすると、店内の枠に重なって開く。中身(文章)は暗号化された中身に入っている。
     デザインの幅 402px のまま組み、JS が枠の幅に合わせて zoom で拡大・縮小する */
  .case-overlay { /* About と同じく、店内の枠(.works-frame)と同じ大きさ・位置の枠の中でスクロールする */
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(100vw, 430px);
    /* 高さは店内の枠と同じ(幅 × 1376/768、画面の高さまで)。aspect-ratio だと Safari では
       中身の長さに引っぱられて画面いっぱいに伸びるので、計算して指定する */
    height: min(100vh, min(100vw, 430px) * 1376 / 768);
    height: min(100dvh, min(100vw, 430px) * 1376 / 768);
    transform: translate(-50%, -50%);
    z-index: 20;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    /* 上の帯(タブ)の後ろはオレンジにする。拡大・縮小で端が 1px ずれても、上に薄い線が出ないように */
    background: linear-gradient(#df9079 40px, var(--overlay-bg, #f2eee3) 40px);
    color: #000;
    visibility: hidden;
    scrollbar-width: none;
  }
  .case-overlay::-webkit-scrollbar { display: none; }
  .case-overlay:focus { outline: none; } /* 開いたときにキーボード操作のためフォーカスを移すが、枠線は出さない */
  .case-overlay.show { visibility: visible; }
  /* ケースが開ききったら、後ろの店内(枠)を隠す。枠とケースの端が少しでもずれると、
     店内の明るい天井が細い線に見えるため。後ろは背景と同じオレンジになる */
  .works-frame.case-covered { visibility: hidden; }
  /* 開くとき: 開いた私書箱の大きさから、手紙を取り出すように枠いっぱいへ広がる(JS が clip-path を動かす)。
     中身は少し下から浮き上がって出てくる */
  .case-overlay.opening .case { animation: case-rise 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .case.rise .case-content, .case.rise .case-back { animation: case-switch 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; } /* タブで切り替えたとき */
  @keyframes case-switch { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes case-rise {
    0%, 45% { opacity: 0; transform: translateY(24px); } /* 広がりきる少し前から出す */
    100% { opacity: 1; transform: none; }
  }
  .case {
    --case-serif: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", P052, serif;
    --case-mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    /* 本文のゴシック。Figma の TB新聞ゴシック(モリサワ・Web では使えない)にいちばん近い無料フォント Murecho */
    --case-gothic: "Murecho", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: none;
    width: 402px;
    flex-direction: column;
    gap: 120px;
    padding-bottom: 120px;
    /* 一番上の帯の部分はオレンジ。拡大表示で地のクリーム色が帯の上に 1px はみ出して線に見えないように */
    background: linear-gradient(#df9079 32px, var(--case-bg) 32px);
    font-family: var(--case-gothic);
    font-size: 13px;
    line-height: 23px; /* Figma の 1.8 は px に丸められて 23px */
    word-break: break-word;
    cursor: auto;
  }
  .case.show { display: flex; }
  /* ケースごとの地の色(タブの色と同じ) */
  .case { --case-bg: #f2eee3; }
  .case[data-case="02"] { --case-bg: #d6e7f7; }
  .case[data-case="03"] { --case-bg: #ecd1cd; }
  .case[data-case="04"] { --case-bg: #d9e9de; }
  .case[data-case="05"] { --case-bg: #eae1a7; }
  .case h1, .case h2, .case h3, .case p, .case ul, .case dl, .case dd, .case dt { margin: 0; padding: 0; font-weight: inherit; font-size: inherit; }
  .case-tabs { /* タブは帯の下にそろえる(上に 8px の余白)。スクロールしても上に固定 */
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 2;
    height: 32px;
    background: #df9079;
  }
  /* 帯の上にもオレンジを少しはみ出させる。Safari ではスクロール中、固定した帯が 1px 下にずれて、
     その上の 1 列に後ろの本文(クリーム色)が細い線になって見えるため */
  .case-tabs::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: 6px;
    background: #df9079;
  }
  .case-tab { /* 下へ 1px はみ出させて、拡大・縮小したときにタブと本文の間に帯の色が線になって見えないようにする */
    position: absolute;
    bottom: -1px;
    width: 86px;
    height: 25px;
    padding-top: 3px;
    margin: 0;
    border: 0;
    border-radius: 0;
    background: center / 100% 100% no-repeat;
    color: #000;
    font: 400 16px/1 "Bentham", serif;
    text-align: center;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .case-tab[disabled] { cursor: default; }
  .case-tab.is-current { cursor: default; z-index: 10; } /* 開いているケースのタブが一番手前(ほかは近い順に重なる。JS) */
  .case-tab:focus-visible { outline: 2px solid #000; outline-offset: -4px; }
  .case-tab[data-tab="01"] { left: 0; background-image: url(assets/img/case-tab-01.svg?v=2); }
  .case-tab[data-tab="02"] { left: 79px; background-image: url(assets/img/case-tab-02.svg?v=2); }
  .case-tab[data-tab="03"] { left: 158px; background-image: url(assets/img/case-tab-03.svg?v=2); }
  .case-tab[data-tab="04"] { left: 237px; background-image: url(assets/img/case-tab-04.svg?v=2); }
  .case-tab[data-tab="05"] { left: 316px; background-image: url(assets/img/case-tab-05.svg?v=2); }
  .case-content { display: flex; flex-direction: column; gap: 120px; padding: 0 32px; }
  .case-top { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .case-title { display: flex; flex-direction: column; align-items: center; gap: 72px; font-family: var(--case-serif); font-weight: 700; line-height: 1; }
  .case-no { font-size: 13px; }
  .case .case-title h1 { font-size: 64px; font-weight: 700; text-align: center; }
  .case-sub, .case-back { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .case-line { width: 0; height: 64px; border-left: 1px solid #000; }
  .case-sub p { font: 800 13px/1 var(--case-mincho); text-align: center; }
  .case-sub p.case-sub-multi { line-height: 23.4px; } /* 2 行のときは 1.8 */
  .case-meta { display: flex; flex-direction: column; gap: 24px; }
  .case-meta > div { display: flex; flex-direction: column; gap: 12px; padding-top: 28px; border-top: 1px solid #000; }
  .case-meta > div:first-child { gap: 16px; }
  .case-meta dt { font: 700 11px/1 var(--case-serif); }
  .case-meta dd { font: 800 16px/1.7 var(--case-mincho); }
  .case-meta dd small { font-size: 11px; }
  .case-meta dd small.case-meta-line { display: block; line-height: 17px; }
  .case-meta dd.case-meta-en { font: 700 24px/1 var(--case-serif); }
  .case-meta a { color: inherit; text-decoration: underline; text-underline-position: from-font; }
  .case-list { display: flex; flex-direction: column; gap: 72px; }
  .case-table-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 16px;
    border: 1px solid #000;
    line-height: 1;
    white-space: nowrap;
  }
  .case .case-table-title h2 { font: 700 24px/1 var(--case-serif); }
  .case-table-title p { font: 800 13px/1 var(--case-mincho); }
  .case-text { padding: 40px 16px; border: 1px solid #000; border-top: 0; font-weight: 500; }
  .case-text strong { font-weight: 800; } /* TB新聞見出ゴシック ExBold の代わり */
  .case-text ul { list-style: disc; padding-left: 19.5px; }
  .case-text .case-gap { margin-top: 23px; }

<!-- PC幅のみの装飾は pc-deco.js が注入する(index/about/works共通) -->
<script src="pc-deco.js?v=28"></script>

<script>
(function () {
  var frame = document.getElementById("worksFrame");

  // 登場時に「溶ける」エフェクトを再生する。歪みはGPU(WebGL)で描くので
  // 画面が大きくても軽い。画像のデコード後、実際に描画が始まってから1本の時計で動かす
  var DUR = 1400;
  var MAX_SCALE = 190; // 歪みの強さ(px)
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img = frame.querySelector(".works-img");
  var melt = null; // WebGLが使えないときは null(ふわっと表示するだけ)
  var run = 0;

  var FRAG = [
    "precision highp float;",
    "uniform sampler2D tex;",
    "uniform vec2 size;",  // 枠の大きさ(px)
    "uniform vec2 freq;",  // ノイズの細かさ
    "uniform float scale;",
    "varying vec2 uv;",
    "float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
    "float noise(vec2 p) {",
    "  vec2 i = floor(p), f = fract(p);",
    "  f = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);",
    "}",
    "float fbm(vec2 p) { return noise(p) * 0.65 + noise(p * 2.0 + 17.0) * 0.35; }",
    "void main() {",
    "  vec2 p = uv * size * freq;",
    "  vec2 d = vec2(fbm(p + vec2(3.1, 7.7)), fbm(p + vec2(11.3, 2.9))) - 0.5;",
    "  vec2 q = uv + d * scale / size;",
    "  if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;", // 外側は背景が見える
    "  gl_FragColor = texture2D(tex, q);",
    "}"
  ].join("\n");
  var VERT = [
    "attribute vec2 pos;",
    "varying vec2 uv;",
    "void main() {",
    "  uv = vec2(pos.x * 0.5 + 0.5, 0.5 - pos.y * 0.5);",
    "  gl_Position = vec4(pos, 0.0, 1.0);",
    "}"
  ].join("\n");

  function initMelt() {
    var canvas = document.createElement("canvas");
    canvas.className = "works-gl";
    canvas.setAttribute("aria-hidden", "true");
    var gl = canvas.getContext("webgl", { antialias: false });
    if (!gl) return null;
    function shader(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;

    if (!vs || !fs) return null;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    frame.appendChild(canvas);
    return {
      gl: gl,
      canvas: canvas,
      size: gl.getUniformLocation(prog, "size"),
      freq: gl.getUniformLocation(prog, "freq"),
      scale: gl.getUniformLocation(prog, "scale")
    };
  }

  function applyMelt(p) {
    var e = 1 - Math.pow(1 - p, 4); // 終盤で急速に収束
    frame.style.opacity = p < 0.35 ? (0.15 + 0.85 * (p / 0.35)).toFixed(3) : "";
    if (!melt) return;
    var gl = melt.gl, w = frame.clientWidth, h = frame.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    melt.canvas.width = Math.round(w * dpr);
    melt.canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, melt.canvas.width, melt.canvas.height);
    gl.uniform2f(melt.size, w, h);
    gl.uniform2f(melt.freq, 0.009, 0.03 - 0.024 * e);
    gl.uniform1f(melt.scale, MAX_SCALE * (1 - e));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var skipMelt = false; // 登場のエフェクトが始まる前に電話がタップされたら、エフェクトはしない
  function startMelt() {

    var id = ++run, elapsed = 0, last = null;
    if (melt === null) {
      try { melt = initMelt(); } catch (err) { melt = null; }
    } else if (melt) { // 画像が差し替わっていることがあるので読み込み直す
      melt.gl.texImage2D(melt.gl.TEXTURE_2D, 0, melt.gl.RGBA, melt.gl.RGBA, melt.gl.UNSIGNED_BYTE, img);
    }
    applyMelt(0);
    frame.classList.remove("melt-wait");
    if (melt) frame.classList.add("melting");
    function step(now) {
      if (id !== run) return;
      // 1コマで進むのは最大100ms。読み込みで止まっても飛ばず、重い環境でも必ず最後まで進む
      if (last !== null) elapsed += Math.min(now - last, 100);
      last = now;
      var p = Math.min(1, elapsed / DUR);

  }

    frame.classList.remove("melt-wait", "melting");
    frame.style.opacity = "";

  function whenReady() {
    if (reduceMotion) { frame.classList.remove("melt-wait"); return; }

    else if (img.complete) { startMelt(); }
    else {
      img.addEventListener("load", startMelt, { once: true });
      img.addEventListener("error", startMelt, { once: true });

    var open = document.querySelector("#worksSecret .works-open-img");
    if (!open) return;
    img.alt = open.alt;
    img.src = open.src;

    buildLockers();

      frame.classList.remove("phone-zoom");
      frame.classList.add("opened");

      startMelt();
    }

  });

  // 鍵(札)の掛かった私書箱。caseId があるものは、開いた箱の中をタップするとそのケーススタディが開く。
  // 名札の番号(no)とその中心(label)、店内の画像(1116×2000)での位置 [左, 上, 右, 下] と、
  // 開いたデザインでの扉の四隅(蝶番側の上・下、開く側の上・下)
  var LOCKERS = [
    { no: "#01", caseId: "01", label: [781.5, 254.2], box: [667, 205, 887, 428], ht: [866, 212], hb: [866, 414], ft: [969, 157], fb: [971, 370] },
    { no: "#02", caseId: "02", label: [559.4, 476.4], box: [447, 429, 666, 746], ht: [644, 440], hb: [644, 736], ft: [736, 404], fb: [736, 706] },
    { no: "#03", caseId: "03", label: [337.3, 790.3], box: [227, 747, 446, 961], ht: [419, 760], hb: [419, 951], ft: [500, 749], fb: [500, 951] },
    { no: "#04", caseId: "04", label: [781.5, 790.3], box: [667, 747, 887, 961], ht: [868, 760], hb: [868, 951], ft: [971, 745], fb: [971, 951] },
    { no: "#05", label: [559.4, 1005.5], box: [447, 962, 666, 1176], ht: [644, 976], hb: [644, 1172], ft: [736, 972], fb: [737, 1170] }
  ];
  var OPEN_ANGLE = 113; // 開いたデザインの扉の角度(度)
  // 開いたデザインの5枚の扉(板の大きさで回したもの)から求めた、写真を撮ったカメラ(目の位置と距離。写真の px)
  var CAMERA = { x: 300, y: 1100, d: 3000 };
  var THICK = 0.05;     // 扉の厚み(扉の幅に対する割合)
  var OPEN_MS = 420, CLOSE_MS = 360;
  // 名札の番号の文字(Figma: Bentham Regular 7px。店内の画像の px では 7 × 1116/402)
  var LABEL_FONT = '400 19.43px Bentham, serif', LABEL_COLOR = "#bf603c";

  function pct(v, total) { return (v / total * 100) + "%"; }

  // 4点 src を 4点 dst に移す射影変換を CSS の matrix3d にする
  function homography(src, dst) {
    var A = [], b = [];
    for (var i = 0; i < 4; i++) {
      var x = src[i][0], y = src[i][1], u = dst[i][0], v = dst[i][1];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    for (var c = 0; c < 8; c++) { // ガウスの消去法
      var piv = c;
      for (var r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      var t = A[c]; A[c] = A[piv]; A[piv] = t; t = b[c]; b[c] = b[piv]; b[piv] = t;
      for (r = 0; r < 8; r++) {
        if (r === c) continue;
        var f = A[r][c] / A[c][c];
        for (var k = c; k < 8; k++) A[r][k] -= f * A[c][k];
        b[r] -= f * b[c];

    return "matrix3d(" + [h[0], h[3], 0, h[6], h[1], h[4], 0, h[7], 0, 0, 1, 0, h[2], h[5], 0, 1].join(",") + ")";
  }

  // 角度 deg のときの扉の四隅(箱の左上からの写真の px)。
  // 扉を蝶番のまわりに 3D で回して CAMERA から見た形にし、開いたデザインとのわずかな差は、開くにつれて足していく
  function project(X, Y, Z) {
    var f = CAMERA.d / (CAMERA.d - Z);
    return [CAMERA.x + (X - CAMERA.x) * f, CAMERA.y + (Y - CAMERA.y) * f];
  }
  function rotated(L, deg) { // 回るのは縁取りの内側の板(L.inner)。蝶番は板の右端
    var b = L.inner, w = b[2] - b[0], th = deg * Math.PI / 180;
    var X = b[2] - w * Math.cos(th), Z = w * Math.sin(th);

    var b = L.box, r = rotated(L, deg), end = rotated(L, OPEN_ANGLE);
    var p = Math.min(1, deg / OPEN_ANGLE), k = p * p * (3 - 2 * p); // 差を足す割合(なめらかに)
    var q = {};
    ["ht", "hb", "ft", "fb"].forEach(function (c) {
      q[c] = [r[c][0] + (L[c][0] - end[c][0]) * k - b[0], r[c][1] + (L[c][1] - end[c][1]) * k - b[1]];
    });

  }


  // 音(鍵を回すカチッ・扉が閉まるパタン)。WebAudio のノイズを短く鳴らす
  var actx = null;
  function knock(freq, volume, len) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();

      var n = Math.floor(actx.sampleRate * len), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);

      f.type = "bandpass";
      f.frequency.value = freq;
      f.Q.value = 1.5;
      g.gain.value = volume;
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start();
    } catch (err) {}
  }

  // サービスベルの「チーン」。少しずらした高い音を重ねて、金属らしい響き(うなり)と余韻を出す
  function ding() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var t = actx.currentTime, out = actx.createGain();
      out.gain.value = 0.45;
      out.connect(actx.destination);
      [[1, 0.30, 2.2], [1.004, 0.18, 1.9], [2.76, 0.10, 0.8], [5.40, 0.05, 0.4], [8.93, 0.025, 0.18]].forEach(function (p) {

        g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
        o.connect(g);
        g.connect(out);
        o.start(t);
        o.stop(t + p[2] + 0.05);
      });
    } catch (err) {}
  }

  function restart(el, cls) { // 同じアニメーションをもう一度最初から再生する
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  // ---------- ケーススタディ ----------
  var caseOverlay = null, caseFrom = null;
  function fitCase() { // 店内の枠とまったく同じ位置・大きさに重ね、デザインの幅 402px を枠の幅に合わせる

    // 後ろの店内の天井が上の端に細い線になって見える。枠の実際の位置をそのまま使う
    var fr = frame.getBoundingClientRect();
    if (fr.width) {
      caseOverlay.style.transform = "none";
      caseOverlay.style.left = fr.left + "px";
      caseOverlay.style.top = fr.top + "px";
      caseOverlay.style.width = fr.width + "px";
      caseOverlay.style.height = fr.height + "px";
    }

    caseOverlay.querySelectorAll(".case").forEach(function (c) { c.style.zoom = z; });
  }
  function buildCases() {
    var cases = document.querySelectorAll("#worksSecret .case");

      if (tab && !tab.disabled && !tab.classList.contains("is-current")) switchCase(tab.dataset.tab);
    });
    // タブの重なり: 開いているケースが一番手前、ほかはそこから近い順
    caseOverlay.querySelectorAll(".case").forEach(function (c) {
      var cur = +c.dataset.case;
      c.querySelectorAll(".case-tab").forEach(function (t) {
        if (!t.classList.contains("is-current")) t.style.zIndex = 9 - Math.abs(+t.dataset.tab - cur);
      });
    });
    document.body.appendChild(caseOverlay);
    window.addEventListener("resize", fitCase);
    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && caseOverlay.classList.contains("show")) closeCase();
    });

    window.addEventListener("popstate", function () {
      if (caseOverlay.classList.contains("show")) hideCase();

  }
  // 開いた私書箱(from)の位置を、枠の中の clip-path(inset)にする

  function boxInset(el) {

  function clipTo(from, to, ms, done) { // 箱の形 ⇄ 枠いっぱい(Web Animations。Safari でも確実に動く)

    clipAnim.onfinish = function () { done(); };
  }
  function openCase(id, fromEl) {
    if (!caseOverlay) return false;
    var target = caseOverlay.querySelector('.case[data-case="' + id + '"]');
    if (!target) return false;
    caseOverlay.querySelectorAll(".case").forEach(function (c) { c.classList.toggle("show", c === target); c.classList.remove("rise"); });

    caseFromBox = fromEl || null;

      if (on && byKey) menu.querySelector("a").focus({ preventScroll: true }); // キーボードで押したときだけ文字へ移る
    }
    menu.addEventListener("click", function (e) { // 文字以外をタップするとメニューを閉じる
      if (!e.target.closest("a")) showMenu(false);
    });
    frame.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && menu.classList.contains("show")) { showMenu(false); bellBtn.focus(); }
    });
    var ringing = false;
    bellBtn.addEventListener("click", function (e) {
      if (ringing) return;
      var byKey = e.detail === 0;
      ringing = true;
      knock(3200, 0.18, 0.012); // つまみを押すカチッ
      var DOWN = 70, HOLD = 50, UP = 160, GLOW = 750, start = null, rang = false;
      function step(now) {
        if (start === null) start = now;
        var t = now - start;
        // つまみ: すばやく沈んで、少し止まり、ばねで戻る
        if (reduceMotion) bell.d = 0;
        else if (t < DOWN) bell.d = 5 * Math.sin(t / DOWN * Math.PI / 2);
        else if (t < DOWN + HOLD) bell.d = 5;
        else bell.d = Math.max(0, 5 * (1 - (t - DOWN - HOLD) / UP));
        if (t >= DOWN && !rang) { rang = true; ding(); }
        bell.glow = t < DOWN ? 0 : Math.exp(-(t - DOWN) / (GLOW / 3));
        drawClean();
        if (t < DOWN + GLOW) requestAnimationFrame(step);
        else { bell.d = 0; bell.glow = 0; drawClean(); ringing = false; }
      }
      requestAnimationFrame(step);
      setTimeout(function () { showMenu(true, byKey); }, 380);
    });
    layer.appendChild(bellBtn);
    layer.appendChild(menu);
    frame.querySelector(".works-scene").appendChild(layer);
  }

  // シーンのタップでトップへ戻る。ダイヤルを回した指を離したときの click では戻らない
  var goHome = function () { window.location.href = "home.html"; };
  var fromDial = false;
  document.addEventListener("pointerdown", function (e) {
    fromDial = !!(e.target.closest && e.target.closest(".dial-hit"));
  });
  frame.addEventListener("click", function (e) {
    if (fromDial) { fromDial = false; return; }
    // 電話をタップで拡大、拡大中は外をタップで元に戻す
    if (frame.classList.contains("phone-zoom")) { frame.classList.remove("phone-zoom"); return; }
    if (e.target.closest(".phone-tap")) { finishMelt(); frame.classList.add("phone-zoom"); return; }
    if (e.target.closest(".locker")) return; // 私書箱は扉を開け閉めするだけ
    if (frame.classList.contains("opened")) return; // 店内では私書箱以外をタップしても何もしない
    goHome();
  });
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { frame.classList.remove("phone-zoom"); return; }
    if (e.target.closest(".locker") || frame.classList.contains("opened")) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
  });
})();
</script>
