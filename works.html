<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Works (2022~) | Shih TingFang 施婷方 | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bentham&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pc-deco.css?v=46">
<style>
  :root { --diner-bg: #DF9079; --paper: #F5E9CA; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--diner-bg);
    font-family: "Bentham", serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* topページのドア画像と同じサイズ・位置の枠(中に「準備中」の店内) */
  .works-frame {
    position: relative;
    width: min(100vw, 430px);
    aspect-ratio: 768 / 1376;
    max-height: 100dvh;
    overflow: hidden;
    cursor: pointer; /* シーン全体をタップでトップへ戻れる(ボタンは非表示) */
  }

  .works-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 切替時の「溶ける」登場エフェクト: 歪ませたシーンがドロッと固まっていく。
     演出中だけ canvas(WebGL)に歪ませた画像を描く。準備ができるまでは薄くして待つ */
  .works-frame.melt-wait { opacity: 0.15; }
  .works-gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }
  .works-frame.melting .works-gl { display: block; }
  .works-frame.melting .works-img { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .works-frame.melt-wait { opacity: 1; }
  }

  /* ---------- 回転ダイヤル電話(パスワード入力) ----------
     写真の上に、回る盤(dial-wheel)→ 固定の紙と指止め(dial-top)を重ねる。
     位置は写真(1116×2000)に対する割合 */
  .dial-layer { position: absolute; inset: 0; pointer-events: none; }
  .works-frame.melt-wait .dial-layer,
  .works-frame.melting .dial-layer { visibility: hidden; }
  .dial-box {
    position: absolute;
    left: 44%;
    top: 67.585%;
    width: 12.06%;
    aspect-ratio: 1;
    transform: translateY(-50%);
  }
  .dial-wheel {
    display: block;
    width: 100%;
    height: 100%;
    transform: scaleY(0.762) rotate(var(--dial-rot, 0deg));
  }
  .dial-top {
    position: absolute;
    left: 37.63%;
    top: 63%;
    width: 26.88%;
    height: 12%;
  }
  .dial-dots { /* 中央の紙に、入力した桁数を表示 */
    position: absolute;
    left: 50.78%;
    top: 67.41%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 1px;
  }
  .dial-dots i {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(90, 25, 15, 0.22);
  }
  .dial-dots i.on { background: #8c1d14; }
  .dial-hit { /* 指で触れる範囲 */
    position: absolute;
    left: 37%;
    top: 61.5%;
    width: 27%;
    height: 12.5%;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  .works-frame.dial-grabbing .dial-hit { cursor: grabbing; }
  .works-frame.dial-wrong .dial-layer { animation: dial-shake 0.4s ease; }
  @keyframes dial-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .dial-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  /* 正しい番号が入ると出る札。中身の文言は暗号化されている */
  .works-sign {
    position: absolute;
    left: 56.4%;
    top: 42.9%;
    width: 16.4%;
    height: 6.2%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #efe9dc;
    color: #2b2320;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: calc(min(100vw, 430px) * 0.04);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
    transform: rotate(-3deg);
    transform-origin: 50% 0;
    animation: sign-flip 0.7s ease-out both;
  }
  @keyframes sign-flip {
    from { opacity: 0; transform: rotate(-3deg) rotateX(-85deg); }
    to   { opacity: 1; transform: rotate(-3deg) rotateX(0); }
  }
</style>
</head>
<body>

<div class="works-frame melt-wait" id="worksFrame" role="link" tabindex="0" aria-label="トップへ戻る">
  <img class="works-img" src="assets/img/works-closed.webp?v=4" alt="Shih TingFang Diner — Works (2022~) 赤いダイヤル電話">
  <div class="dial-layer">
    <div class="dial-box"><img class="dial-wheel" id="dialWheel" src="assets/img/dial-wheel.webp?v=1" alt="" draggable="false"></div>
    <img class="dial-top" src="assets/img/dial-top.webp?v=1" alt="" draggable="false">
    <div class="dial-dots" id="dialDots" aria-hidden="true"></div>
    <div class="dial-hit" id="dialHit" role="application" aria-label="番号を回して入力するダイヤル。キーボードの数字でも入力できます"></div>
    <div class="dial-status" id="dialStatus" aria-live="polite"></div>
  </div>
  <div id="worksSecret"></div>
</div>

<!-- PC幅のみの装飾は pc-deco.js が注入する(index/about/works共通) -->
<script src="pc-deco.js?v=28"></script>

<script>
(function () {
  var frame = document.getElementById("worksFrame");

  // 登場時に「溶ける」エフェクトを再生する。歪みはGPU(WebGL)で描くので
  // 画面が大きくても軽い。画像のデコード後、実際に描画が始まってから1本の時計で動かす
  var DUR = 1400;
  var MAX_SCALE = 190; // 歪みの強さ(px)
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img = frame.querySelector(".works-img");
  var melt = null; // WebGLが使えないときは null(ふわっと表示するだけ)
  var run = 0;

  var FRAG = [
    "precision highp float;",
    "uniform sampler2D tex;",
    "uniform vec2 size;",  // 枠の大きさ(px)
    "uniform vec2 freq;",  // ノイズの細かさ
    "uniform float scale;",
    "varying vec2 uv;",
    "float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
    "float noise(vec2 p) {",
    "  vec2 i = floor(p), f = fract(p);",
    "  f = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);",
    "}",
    "float fbm(vec2 p) { return noise(p) * 0.65 + noise(p * 2.0 + 17.0) * 0.35; }",
    "void main() {",
    "  vec2 p = uv * size * freq;",
    "  vec2 d = vec2(fbm(p + vec2(3.1, 7.7)), fbm(p + vec2(11.3, 2.9))) - 0.5;",
    "  vec2 q = uv + d * scale / size;",
    "  if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;", // 外側は背景が見える
    "  gl_FragColor = texture2D(tex, q);",
    "}"
  ].join("\n");
  var VERT = [
    "attribute vec2 pos;",
    "varying vec2 uv;",
    "void main() {",
    "  uv = vec2(pos.x * 0.5 + 0.5, 0.5 - pos.y * 0.5);",
    "  gl_Position = vec4(pos, 0.0, 1.0);",
    "}"
  ].join("\n");

  function initMelt() {
    var canvas = document.createElement("canvas");
    canvas.className = "works-gl";
    canvas.setAttribute("aria-hidden", "true");
    var gl = canvas.getContext("webgl", { antialias: false });
    if (!gl) return null;
    function shader(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
    }
    var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return null;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    frame.appendChild(canvas);
    return {
      gl: gl,
      canvas: canvas,
      size: gl.getUniformLocation(prog, "size"),
      freq: gl.getUniformLocation(prog, "freq"),
      scale: gl.getUniformLocation(prog, "scale")
    };
  }

  function applyMelt(p) {
    var e = 1 - Math.pow(1 - p, 4); // 終盤で急速に収束
    frame.style.opacity = p < 0.35 ? (0.15 + 0.85 * (p / 0.35)).toFixed(3) : "";
    if (!melt) return;
    var gl = melt.gl, w = frame.clientWidth, h = frame.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    melt.canvas.width = Math.round(w * dpr);
    melt.canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, melt.canvas.width, melt.canvas.height);
    gl.uniform2f(melt.size, w, h);
    gl.uniform2f(melt.freq, 0.009, 0.03 - 0.024 * e);
    gl.uniform1f(melt.scale, MAX_SCALE * (1 - e));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function startMelt() {
    var id = ++run, elapsed = 0, last = null;
    if (melt === null) {
      try { melt = initMelt(); } catch (err) { melt = null; }
    }
    applyMelt(0);
    frame.classList.remove("melt-wait");
    if (melt) frame.classList.add("melting");
    function step(now) {
      if (id !== run) return;
      // 1コマで進むのは最大100ms。読み込みで止まっても飛ばず、重い環境でも必ず最後まで進む
      if (last !== null) elapsed += Math.min(now - last, 100);
      last = now;
      var p = Math.min(1, elapsed / DUR);
      applyMelt(p);
      if (p < 1) requestAnimationFrame(step);
      else frame.classList.remove("melting");
    }
    requestAnimationFrame(function () { requestAnimationFrame(step); });
  }

  function whenReady() {
    if (reduceMotion) { frame.classList.remove("melt-wait"); return; }
    if (img.decode) { img.decode().then(startMelt, startMelt); }
    else if (img.complete) { startMelt(); }
    else {
      img.addEventListener("load", startMelt, { once: true });
      img.addEventListener("error", startMelt, { once: true });
    }
  }
  whenReady();

  // ブラウザの「戻る」で保存状態から復元されたときも再生する
  window.addEventListener("pageshow", function (e) {
    if (e.persisted && !reduceMotion) startMelt();
  });

  // シーンのタップでトップへ戻る。ダイヤルを回した指を離したときの click では戻らない
  var goHome = function () { window.location.href = "index.html"; };
  var fromDial = false;
  document.addEventListener("pointerdown", function (e) {
    fromDial = !!(e.target.closest && e.target.closest(".dial-hit"));
  });
  frame.addEventListener("click", function () {
    if (fromDial) { fromDial = false; return; }
    goHome();
  });
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
  });
})();
</script>
<script src="works-dial.js?v=1"></script>
</body>
</html>
