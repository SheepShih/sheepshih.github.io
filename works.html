<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Works (2022~) | Shih TingFang 施婷方 | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bentham&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pc-deco.css?v=46">
<style>
  :root { --diner-bg: #DF9079; --paper: #F5E9CA; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--diner-bg);
    font-family: "Bentham", serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* topページのドア画像と同じサイズ・位置の枠(中に「準備中」の店内) */
  .works-frame {
    position: relative;
    width: min(100vw, 430px);
    aspect-ratio: 768 / 1376;
    max-height: 100dvh;
    overflow: hidden;
    cursor: pointer; /* シーン全体をタップでトップへ戻れる(ボタンは非表示) */
  }

  .works-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 切替時の「溶ける」登場エフェクト: 歪ませたシーンがドロッと固まっていく。
     歪みと透明度はJSが同じ時計で動かす。準備ができるまでは薄くして待つ */
  .works-frame.melt-wait { opacity: 0.15; }
  /* フィルターは枠の中の画像にかける。枠にかけると、はみ出た歪みの跡が
     Mac の Safari で枠の外に残ることがある(画像なら枠の overflow で切れる) */
  .works-frame.melting .works-img { filter: url(#meltFilter); }

  @media (prefers-reduced-motion: reduce) {
    .works-frame.melt-wait { opacity: 1; }
    .works-frame.melting .works-img { filter: none; }
  }
</style>
</head>
<body>

<!-- 「溶ける」用のSVGフィルター(タービュランス+ディスプレイスメント) -->
<svg class="melt-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="meltFilter" x="-15%" y="-15%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence id="meltTurb" type="fractalNoise" baseFrequency="0.009 0.03" numOctaves="2" seed="6" result="turb"/>
      <feDisplacementMap id="meltMap" in="SourceGraphic" in2="turb" scale="190"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="works-frame melt-wait" id="worksFrame" role="link" tabindex="0" aria-label="トップへ戻る">
  <img class="works-img" src="assets/img/works-closed.webp?v=4" alt="Shih TingFang Diner — Works (2022~) は準備中です">
</div>

<!-- PC幅のみの装飾は pc-deco.js が注入する(index/about/works共通) -->
<script src="pc-deco.js?v=28"></script>

<script>
(function () {
  var frame = document.getElementById("worksFrame");

  // 登場時に「溶ける」エフェクトを再生する。
  // 画像のデコードが終わり、実際に描画が始まってから1本の時計で動かす
  // (読み込みが重いスマホでも、見えないうちに演出が終わらないように)
  var DUR = 1400;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img = frame.querySelector(".works-img");
  var turb = document.getElementById("meltTurb");
  var map = document.getElementById("meltMap");
  var run = 0, tick = false;

  function applyMelt(p) {
    var e = 1 - Math.pow(1 - p, 4); // 終盤で急速に収束
    map.setAttribute("scale", (190 * (1 - e)).toFixed(1));
    turb.setAttribute("baseFrequency", "0.009 " + (0.03 - 0.024 * e).toFixed(4));
    frame.style.opacity = p < 0.35 ? (0.15 + 0.85 * (p / 0.35)).toFixed(3) : "";
    // Safari はフィルターの属性を変えただけでは描き直さないことがあるので、毎コマ促す
    tick = !tick;
    img.style.filter = "url(#meltFilter)" + (tick ? " brightness(1)" : "");
  }

  function endMelt() {
    img.style.filter = "";
    frame.classList.remove("melting");
    // 歪んだ描画が残らないよう、画像を確実に描き直す
    img.style.visibility = "hidden";
    void img.offsetWidth;
    img.style.visibility = "";
  }

  function startMelt() {
    var id = ++run, elapsed = 0, last = null;
    frame.classList.remove("melt-wait");
    frame.classList.add("melting");
    applyMelt(0);
    function step(now) {
      if (id !== run) return;
      // 1コマで進むのは最大100ms。読み込みで止まっても飛ばず、
      // 描画が重い環境(Safariなど)でも必ず最後まで進む
      if (last !== null) elapsed += Math.min(now - last, 100);
      last = now;
      var p = Math.min(1, elapsed / DUR);
      applyMelt(p);
      if (p < 1) requestAnimationFrame(step);
      else endMelt();
    }
    requestAnimationFrame(function () { requestAnimationFrame(step); });
  }

  function whenReady() {
    if (reduceMotion) { frame.classList.remove("melt-wait"); return; }
    if (img.decode) { img.decode().then(startMelt, startMelt); }
    else if (img.complete) { startMelt(); }
    else {
      img.addEventListener("load", startMelt, { once: true });
      img.addEventListener("error", startMelt, { once: true });
    }
  }
  whenReady();

  // ブラウザの「戻る」で保存状態から復元されたときも再生する
  window.addEventListener("pageshow", function (e) {
    if (e.persisted && !reduceMotion) startMelt();
  });

  var goHome = function () { window.location.href = "index.html"; };
  frame.addEventListener("click", goHome);
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
  });
})();
</script>
</body>
</html>
