<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Works (2022~) | Shih TingFang 施婷方 | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bentham&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pc-deco.css?v=46">
<style>
  :root { --diner-bg: #DF9079; --paper: #F5E9CA; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--diner-bg);
    font-family: "Bentham", serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* topページのドア画像と同じサイズ・位置の枠(中に「準備中」の店内) */
  .works-frame {
    position: relative;
    width: min(100vw, 430px);
    aspect-ratio: 768 / 1376;
    max-height: 100dvh;
    overflow: hidden;
    cursor: pointer; /* シーン全体をタップでトップへ戻れる(ボタンは非表示) */
  }

  .works-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 切替時の「溶ける」登場エフェクト: 歪ませたシーンがドロッと固まっていく。
     演出中だけ canvas(WebGL)に歪ませた画像を描く。準備ができるまでは薄くして待つ */
  .works-frame.melt-wait { opacity: 0.15; }
  .works-gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }
  .works-frame.melting .works-gl { display: block; }
  .works-frame.melting .works-img { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .works-frame.melt-wait { opacity: 1; }
    .works-scene { transition: none; }
  }

  /* ---------- 回転ダイヤル電話(パスワード入力) ----------
     写真の上に、穴を消した写真の盤(dial-bed)→ 穴の奥の影(dial-shadow、回る)→ 穴の縁(dial-rim、回る)
     → 穴の奥の壁(dial-wall)→ 固定の紙と指止め(dial-top)を重ねる。
     回る部分は works-dial.js が canvas に描く(ブラウザによる見え方の違いをなくすため)。
     位置は写真(1116×2000)に対する割合 */
  /* 電話をタップするとシーン全体がダイヤルを中心に拡大する */
  .works-scene { /* 写真と同じ縦横比の箱。枠が縦に短いとき(スマホで画面の高さが足りないとき)は
                   上下を均等に切る(object-fit: cover と同じ)。ダイヤルの部品は写真に対する割合で置くので、ずれない */
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    aspect-ratio: 768 / 1376;
    margin-top: -89.583%; /* 高さの半分(幅 × 1376/768 ÷ 2) */
    transform-origin: 50% 67.6%;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .works-frame.phone-zoom .works-scene { transform: scale(2.4); }
  .phone-tap { /* 電話全体。拡大前はここのタップで拡大する */
    position: absolute;
    left: 32%;
    top: 60%;
    width: 37%;
    height: 17.5%;
    pointer-events: auto;
    cursor: zoom-in;
  }
  .works-frame.phone-zoom { cursor: zoom-out; }
  .works-frame.phone-zoom .phone-tap { cursor: inherit; }
  .works-frame:not(.phone-zoom) .dial-hit { pointer-events: none; }
  .dial-layer { position: absolute; inset: 0; pointer-events: none; }
  .works-frame.melt-wait .dial-layer,
  .works-frame.melting .dial-layer { visibility: hidden; }
  .dial-box {
    position: absolute;
    left: 43.548%;
    top: 67.75%;
    width: 14.337%;
    aspect-ratio: 1;
    transform: translateY(-50%);
  }
  .dial-canvas { /* 回る部分(影・穴の縁・穴の奥の壁)は works-dial.js が描く */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .dial-bed {
    position: absolute;
    left: 42.115%;
    top: 64.5%;
    width: 17.204%;
    height: 6.5%;
  }
  .dial-top {
    position: absolute;
    left: 37.63%;
    top: 63%;
    width: 26.88%;
    height: 12%;
  }
  .dial-dots { /* 中央の紙に、入力した桁数を表示 */
    position: absolute;
    left: 50.78%;
    top: 67.41%;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: repeat(4, 3px); /* 2行に並べる */
    gap: 1px;
    opacity: 0; /* 電話を拡大してから出す */
    transition: opacity 0.3s ease 0.2s;
  }
  .works-frame.phone-zoom .dial-dots { opacity: 1; }
  .dial-dots i {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(90, 25, 15, 0.22);
  }
  .dial-dots i.on { background: #8c1d14; }
  .dial-hit { /* 指で触れる範囲 */
    position: absolute;
    left: 37%;
    top: 61.5%;
    width: 27%;
    height: 12.5%;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  .works-frame.dial-grabbing .dial-hit { cursor: grabbing; }
  /* 正解すると店内(Works 2022~)に切り替わる。画像は暗号化された中身(#worksSecret)に入っている */
  #worksSecret { display: none; }
  .works-frame.opened .dial-layer { display: none; }
  .works-frame.opened .works-scene { transform: none; transition: none; }

  /* 店内の、鍵の掛かった私書箱。タップで鍵が回り、扉が右の蝶番を軸に手前へ開く。札は扉の動きで揺れる。
     扉(鍵と札を消したもの)・鍵・札の画像は暗号化された中身に入っている。位置は下の LOCKERS */
  .locker-layer { position: absolute; inset: 0; display: none; }
  .works-frame.opened .locker-layer { display: block; }
  .works-frame.melt-wait .locker-layer,
  .works-frame.melting .locker-layer { visibility: hidden; }
  .locker {
    position: absolute;
    padding: 0;
    border: 0;
    background: none;
    perspective: 520px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .locker.open, .locker.moving { z-index: 1; }
  .locker:focus-visible { outline: 2px solid #fff6dc; outline-offset: 2px; }
  .locker span, .locker img { position: absolute; display: block; }
  .locker img { width: 100%; height: 100%; pointer-events: none; }
  .locker-inside { inset: 1.5%; overflow: hidden; background: #3a291e; } /* 扉の奥の箱。壁は JS が遠近で描く */
  .locker-inside i { position: absolute; inset: 0; }
  .locker-inside::after { /* 入口の縁に落ちる影 */
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45), inset 3px 5px 9px rgba(0, 0, 0, 0.55);
  }
  .locker-cast { /* 開いた扉が右の壁に落とす影 */
    left: 100%;
    top: 2%;
    width: 42%;
    height: 98%;
    background: linear-gradient(90deg, rgba(70, 35, 15, 0.32), rgba(70, 35, 15, 0));
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .locker.open .locker-cast { opacity: 1; transition: opacity 0.9s ease 0.2s; }
  .locker-door {
    inset: 0;
    transform-origin: 100% 50%; /* 蝶番は右側 */
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.55, 0, 0.85, 0.45); /* 閉じるときは加速してパタンと当たる */
  }
  .locker.open .locker-door {
    transform: rotateY(108deg);
    transition: transform 1s cubic-bezier(0.22, 0.75, 0.3, 1.04);
  }
  .locker-front, .locker-back, .locker-edge {
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .locker-front { transform-style: preserve-3d; }
  .locker-front::after { /* 開くにつれて扉の表が暗くなる */
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(60, 30, 15, 0.4);
    opacity: 0;
    transition: opacity 0.55s ease;
  }
  .locker.open .locker-front::after { opacity: 1; transition: opacity 1s ease; }
  .locker-edge { /* 扉の厚み(開く側の縁) */
    left: 0;
    right: auto;
    width: var(--t, 4px);
    transform-origin: 0 50%;
    transform: rotateY(90deg);
    background: linear-gradient(90deg, #b99d78, #d9c6a5);
    -webkit-backface-visibility: visible;
    backface-visibility: visible;
  }
  .locker-back { /* 扉の裏。錠の受けの金具が付いている */
    transform: translateZ(calc(var(--t, 4px) * -1)) rotateY(180deg);
    background:
      linear-gradient(90deg, rgba(80, 45, 20, 0.28), rgba(80, 45, 20, 0) 40%, rgba(255, 245, 225, 0.18)),
      #dccaa9;
    box-shadow: inset 0 0 0 1px rgba(150, 100, 60, 0.45), inset 0 0 0 5px rgba(255, 246, 228, 0.25);
  }
  .locker-bolt {
    width: 15%;
    height: 9%;
    border-radius: 2px;
    background: linear-gradient(180deg, #e6c98a, #a98341 60%, #8a6630);
    box-shadow: 0 1px 2px rgba(60, 30, 10, 0.45);
  }
  .locker-key { transition: transform 0.24s ease-in-out; }
  .locker.turned .locker-key { transform: scaleX(0.18); } /* 鍵を90度回す(横から見る形になる) */
  .locker-tag, .locker-tag > span { inset: 0; }
  .locker-tag > span { transform-style: preserve-3d; }
  .locker.jolt .locker-tag { animation: tag-jolt 0.9s ease-out; }             /* 鍵を回したとき、輪がねじれて札がくるっと揺れる */
  .locker.swing-open .locker-tag > span { animation: tag-open 1.9s linear; }  /* 開いて止まった勢いで札が手前へ跳ねる */
  .locker.swing-close .locker-tag > span { animation: tag-close 1.2s linear; } /* 閉じる勢いで浮いて、当たって跳ねる */
  @keyframes tag-jolt {
    0% { transform: rotate(0); }
    20% { transform: rotate(-11deg); }
    45% { transform: rotate(7deg); }
    70% { transform: rotate(-3deg); }
    100% { transform: rotate(0); }
  }
  @keyframes tag-open {
    0% { transform: rotateX(0) rotate(0); }
    35% { transform: rotateX(4deg) rotate(-3deg); }
    50% { transform: rotateX(42deg) rotate(5deg); animation-timing-function: ease-in; }
    62% { transform: rotateX(6deg) rotate(-4deg); animation-timing-function: ease-out; }
    72% { transform: rotateX(18deg) rotate(3deg); animation-timing-function: ease-in; }
    82% { transform: rotateX(2deg) rotate(-1.5deg); animation-timing-function: ease-out; }
    90% { transform: rotateX(6deg) rotate(1deg); }
    100% { transform: rotateX(0) rotate(0); }
  }
  @keyframes tag-close {
    0% { transform: rotateX(0); animation-timing-function: ease-out; }
    30% { transform: rotateX(30deg); animation-timing-function: ease-in; }
    46% { transform: rotateX(0) rotate(-4deg); animation-timing-function: ease-out; }
    60% { transform: rotateX(14deg) rotate(3deg); animation-timing-function: ease-in; }
    74% { transform: rotateX(0) rotate(-1.5deg); animation-timing-function: ease-out; }
    85% { transform: rotateX(4deg); }
    100% { transform: rotateX(0) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .locker-door, .locker.open .locker-door, .locker-front::after, .locker-key, .locker-cast { transition: none !important; }
    .locker .locker-tag, .locker .locker-tag > span { animation: none !important; }
  }
  .dial-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
</style>
</head>
<body>

<div class="works-frame melt-wait" id="worksFrame" role="link" tabindex="0" aria-label="トップへ戻る">
  <div class="works-scene">
  <img class="works-img" src="assets/img/works-closed.webp?v=12" alt="Shih TingFang Diner — Works (2022~) 赤いダイヤル電話">
  <div class="dial-layer">
    <div class="phone-tap" id="phoneTap"></div>
    <img class="dial-bed" src="assets/img/dial-bed.webp?v=4" alt="" draggable="false">
    <div class="dial-box" id="dialBox">
      <canvas class="dial-canvas" id="dialCanvas"></canvas>
    </div>
    <img class="dial-top" src="assets/img/dial-top.webp?v=2" alt="" draggable="false">
    <div class="dial-dots" id="dialDots" aria-hidden="true"></div>
    <div class="dial-hit" id="dialHit" role="application" aria-label="番号を回して入力するダイヤル。キーボードの数字でも入力できます"></div>
    <div class="dial-status" id="dialStatus" aria-live="polite"></div>
  </div>
  </div>
  <div id="worksSecret"></div>
</div>

<!-- PC幅のみの装飾は pc-deco.js が注入する(index/about/works共通) -->
<script src="pc-deco.js?v=28"></script>

<script>
(function () {
  var frame = document.getElementById("worksFrame");

  // 登場時に「溶ける」エフェクトを再生する。歪みはGPU(WebGL)で描くので
  // 画面が大きくても軽い。画像のデコード後、実際に描画が始まってから1本の時計で動かす
  var DUR = 1400;
  var MAX_SCALE = 190; // 歪みの強さ(px)
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img = frame.querySelector(".works-img");
  var melt = null; // WebGLが使えないときは null(ふわっと表示するだけ)
  var run = 0;

  var FRAG = [
    "precision highp float;",
    "uniform sampler2D tex;",
    "uniform vec2 size;",  // 枠の大きさ(px)
    "uniform vec2 freq;",  // ノイズの細かさ
    "uniform float scale;",
    "varying vec2 uv;",
    "float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
    "float noise(vec2 p) {",
    "  vec2 i = floor(p), f = fract(p);",
    "  f = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);",
    "}",
    "float fbm(vec2 p) { return noise(p) * 0.65 + noise(p * 2.0 + 17.0) * 0.35; }",
    "void main() {",
    "  vec2 p = uv * size * freq;",
    "  vec2 d = vec2(fbm(p + vec2(3.1, 7.7)), fbm(p + vec2(11.3, 2.9))) - 0.5;",
    "  vec2 q = uv + d * scale / size;",
    "  if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;", // 外側は背景が見える
    "  gl_FragColor = texture2D(tex, q);",
    "}"
  ].join("\n");
  var VERT = [
    "attribute vec2 pos;",
    "varying vec2 uv;",
    "void main() {",
    "  uv = vec2(pos.x * 0.5 + 0.5, 0.5 - pos.y * 0.5);",
    "  gl_Position = vec4(pos, 0.0, 1.0);",
    "}"
  ].join("\n");

  function initMelt() {
    var canvas = document.createElement("canvas");
    canvas.className = "works-gl";
    canvas.setAttribute("aria-hidden", "true");
    var gl = canvas.getContext("webgl", { antialias: false });
    if (!gl) return null;
    function shader(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
    }
    var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return null;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    frame.appendChild(canvas);
    return {
      gl: gl,
      canvas: canvas,
      size: gl.getUniformLocation(prog, "size"),
      freq: gl.getUniformLocation(prog, "freq"),
      scale: gl.getUniformLocation(prog, "scale")
    };
  }

  function applyMelt(p) {
    var e = 1 - Math.pow(1 - p, 4); // 終盤で急速に収束
    frame.style.opacity = p < 0.35 ? (0.15 + 0.85 * (p / 0.35)).toFixed(3) : "";
    if (!melt) return;
    var gl = melt.gl, w = frame.clientWidth, h = frame.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    melt.canvas.width = Math.round(w * dpr);
    melt.canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, melt.canvas.width, melt.canvas.height);
    gl.uniform2f(melt.size, w, h);
    gl.uniform2f(melt.freq, 0.009, 0.03 - 0.024 * e);
    gl.uniform1f(melt.scale, MAX_SCALE * (1 - e));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function startMelt() {
    var id = ++run, elapsed = 0, last = null;
    if (melt === null) {
      try { melt = initMelt(); } catch (err) { melt = null; }
    } else if (melt) { // 画像が差し替わっていることがあるので読み込み直す
      melt.gl.texImage2D(melt.gl.TEXTURE_2D, 0, melt.gl.RGBA, melt.gl.RGBA, melt.gl.UNSIGNED_BYTE, img);
    }
    applyMelt(0);
    frame.classList.remove("melt-wait");
    if (melt) frame.classList.add("melting");
    function step(now) {
      if (id !== run) return;
      // 1コマで進むのは最大100ms。読み込みで止まっても飛ばず、重い環境でも必ず最後まで進む
      if (last !== null) elapsed += Math.min(now - last, 100);
      last = now;
      var p = Math.min(1, elapsed / DUR);
      applyMelt(p);
      if (p < 1) requestAnimationFrame(step);
      else frame.classList.remove("melting");
    }
    requestAnimationFrame(function () { requestAnimationFrame(step); });
  }

  function whenReady() {
    if (reduceMotion) { frame.classList.remove("melt-wait"); return; }
    if (img.decode) { img.decode().then(startMelt, startMelt); }
    else if (img.complete) { startMelt(); }
    else {
      img.addEventListener("load", startMelt, { once: true });
      img.addEventListener("error", startMelt, { once: true });
    }
  }
  whenReady();

  // ブラウザの「戻る」で保存状態から復元されたときも再生する
  window.addEventListener("pageshow", function (e) {
    if (e.persisted && !reduceMotion) startMelt();
  });

  // 番号が正解すると(works-dial.js)、復号した店内の画像に差し替えて同じエフェクトで切り替える
  frame.addEventListener("works-unlocked", function () {
    var open = document.querySelector("#worksSecret .works-open-img");
    if (!open) return;
    img.alt = open.alt;
    img.src = open.src;
    document.title = "Works (2022~) | Shih TingFang 施婷方 | Portfolio";
    buildLockers();
    function show() {
      frame.classList.remove("phone-zoom");
      frame.classList.add("opened");
      if (reduceMotion) return;
      frame.classList.add("melt-wait");
      startMelt();
    }
    (img.decode ? img.decode() : Promise.resolve()).then(show, show);
  });

  // 鍵(札)の掛かった私書箱の扉。店内の画像(1116×2000)での位置 [左, 上, 右, 下]
  var LOCKERS = [
    [447, 205, 666, 428],
    [667, 429, 887, 746],
    [227, 747, 446, 961],
    [888, 747, 1040, 961],
    [667, 962, 887, 1176]
  ];
  var EYE = [558, 1000]; // 箱の奥を描くときの消失点(画面の中央あたりから見ている)
  var DEPTH = 0.86;      // 奥の壁の大きさ(消失点に向かって縮める割合)

  function pct(v, total) { return (v / total * 100) + "%"; }
  function polygon(pts) {
    return "polygon(" + pts.map(function (p) { return p[0] + "% " + p[1] + "%"; }).join(",") + ")";
  }
  // 箱の中: 奥の壁と上下左右の壁を、消失点から見た遠近で塗り分ける
  function insideWalls(b) {
    var x0 = b[0] + (b[2] - b[0]) * 0.015, x1 = b[2] - (b[2] - b[0]) * 0.015;
    var y0 = b[1] + (b[3] - b[1]) * 0.015, y1 = b[3] - (b[3] - b[1]) * 0.015;
    function back(x, y) {
      return [(EYE[0] + (x - EYE[0]) * DEPTH - x0) / (x1 - x0) * 100,
              (EYE[1] + (y - EYE[1]) * DEPTH - y0) / (y1 - y0) * 100];
    }
    var tl = back(x0, y0), tr = back(x1, y0), br = back(x1, y1), bl = back(x0, y1);
    var walls = [
      [[[0, 0], [100, 0], tr, tl], "linear-gradient(180deg, #1c120c, #33231a)"],          // 天井(影)
      [[[0, 100], [100, 100], br, bl], "linear-gradient(0deg, #9a7b5f, #6b513e)"],        // 床(光が当たる)
      [[[0, 0], tl, bl, [0, 100]], "linear-gradient(90deg, #6a4f3b, #4a3627)"],           // 左の壁
      [[[100, 0], tr, br, [100, 100]], "linear-gradient(270deg, #24180f, #36261b)"],      // 右の壁(蝶番側、扉の影)
      [[tl, tr, br, bl], "radial-gradient(ellipse at 45% 75%, #574030, #35261b)"]         // 奥の壁
    ];
    return walls.map(function (w) {
      return '<i style="clip-path:' + polygon(w[0]) + ';background:' + w[1] + '"></i>';
    }).join("");
  }

  // 音(鍵を回すカチッ・扉が閉まるパタン)。WebAudio のノイズを短く鳴らす
  var actx = null;
  function knock(freq, volume, len) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var n = Math.floor(actx.sampleRate * len), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      var src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      src.buffer = buf;
      f.type = "bandpass";
      f.frequency.value = freq;
      f.Q.value = 1.5;
      g.gain.value = volume;
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start();
    } catch (err) {}
  }

  function restart(el, cls) { // 同じアニメーションをもう一度最初から再生する
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function buildLockers() {
    var parts = {};
    document.querySelectorAll("#worksSecret .locker-part").forEach(function (im) {
      (parts[im.dataset.i] = parts[im.dataset.i] || {})[im.dataset.part] = im;
    });
    var layer = document.createElement("div");
    layer.className = "locker-layer";
    LOCKERS.forEach(function (b, i) {
      var p = parts[i];
      if (!p) return;
      var w = b[2] - b[0], h = b[3] - b[1];
      var box = document.createElement("button");
      box.type = "button";
      box.className = "locker";
      box.setAttribute("aria-label", "私書箱");
      box.setAttribute("aria-expanded", "false");
      box.style.left = pct(b[0], 1116);
      box.style.top = pct(b[1], 2000);
      box.style.width = pct(w, 1116);
      box.style.height = pct(h, 2000);
      var key = p.key.dataset, tag = p.tag.dataset;
      function place(d) {
        return "left:" + pct(+d.x, w) + ";top:" + pct(+d.y, h) + ";width:" + pct(+d.w, w) + ";height:" + pct(+d.h, h);
      }
      box.innerHTML =
        '<span class="locker-inside">' + insideWalls(b) + '</span>' +
        '<span class="locker-cast"></span>' +
        '<span class="locker-door">' +
          '<span class="locker-front"><img src="' + p.door.src + '" alt="">' +
            '<span class="locker-key" style="' + place(key) + '"><img src="' + p.key.src + '" alt=""></span>' +
            '<span class="locker-tag" style="' + place(tag) + ';transform-origin:' +
              pct(tag.px - tag.x, +tag.w) + ' ' + pct(tag.py - tag.y, +tag.h) + '">' +
              '<span style="transform-origin:inherit"><img src="' + p.tag.src + '" alt=""></span></span>' +
          '</span>' +
          '<span class="locker-edge"></span>' +
          // 裏から見ると左右が逆なので、錠の受けは右寄りに付く
          '<span class="locker-back"><span class="locker-bolt" style="right:' + pct(+key.x - w * 0.04, w) + ';top:' + pct(+key.y + key.h * 0.45, h) + '"></span></span>' +
        '</span>';
      var busy = false;
      box.addEventListener("click", function () {
        if (busy) return;
        box.style.setProperty("--t", (box.offsetWidth * 0.05).toFixed(2) + "px"); // 扉の厚み(3D の奥行きは px で指定するため)
        var opening = !box.classList.contains("open");
        box.setAttribute("aria-expanded", opening ? "true" : "false");
        if (reduceMotion) { box.classList.toggle("open", opening); box.classList.toggle("turned", opening); return; }
        busy = true;
        box.classList.add("moving");
        if (opening) {
          box.classList.add("turned");          // 鍵を回す
          knock(2600, 0.5, 0.025);
          restart(box, "jolt");
          setTimeout(function () {
            box.classList.add("open");          // 扉が開く
            box.classList.remove("swing-close");
            restart(box, "swing-open");
            knock(700, 0.15, 0.08);
          }, 260);
          setTimeout(function () { busy = false; box.classList.remove("moving"); }, 1300);
        } else {
          box.classList.remove("open");         // 扉が閉まる
          box.classList.remove("swing-open");
          restart(box, "swing-close");
          setTimeout(function () { knock(380, 0.7, 0.09); }, 520);
          setTimeout(function () {
            box.classList.remove("turned");     // 鍵を戻す
            knock(2600, 0.4, 0.025);
            restart(box, "jolt");
          }, 820);
          setTimeout(function () { busy = false; box.classList.remove("moving"); }, 1150);
        }
      });
      layer.appendChild(box);
    });
    frame.querySelector(".works-scene").appendChild(layer);
  }

  // シーンのタップでトップへ戻る。ダイヤルを回した指を離したときの click では戻らない
  var goHome = function () { window.location.href = "index.html"; };
  var fromDial = false;
  document.addEventListener("pointerdown", function (e) {
    fromDial = !!(e.target.closest && e.target.closest(".dial-hit"));
  });
  frame.addEventListener("click", function (e) {
    if (fromDial) { fromDial = false; return; }
    // 電話をタップで拡大、拡大中は外をタップで元に戻す
    if (frame.classList.contains("phone-zoom")) { frame.classList.remove("phone-zoom"); return; }
    if (e.target.closest(".phone-tap")) { frame.classList.add("phone-zoom"); return; }
    if (e.target.closest(".locker")) return; // 私書箱は扉を開け閉めするだけ
    goHome();
  });
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { frame.classList.remove("phone-zoom"); return; }
    if (e.target.closest(".locker")) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
  });
})();
</script>
