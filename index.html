<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shih TingFang 施婷方 | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">
<!-- 音楽を止めないための外枠。各ページはこの中の iframe で開き、ページを移っても
     この枠(と音楽)はそのまま残る。アドレスは #about のように今のページに合わせる -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #DF9079; }
  #page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="page" title="Shih TingFang 施婷方 | Portfolio"></iframe>
<script>
(function () {
  var PAGES = { about: 1, works: 1, play: 1 };
  var frame = document.getElementById("page");
  function pageFor(hash) {
    var name = hash.slice(1);
    return (PAGES[name] ? name : "home") + ".html";
  }
  frame.src = pageFor(location.hash) + location.search;
  // アドレスの # だけ書き換えられたとき(#about → #works など)も中のページを切り替える
  window.addEventListener("hashchange", function () {
    frame.contentWindow.location.replace(pageFor(location.hash));
  });

  // 中のページが変わったら、アドレスとタブの名前を合わせる
  frame.addEventListener("load", function () {
    var w = frame.contentWindow, name;
    try { name = w.location.pathname.split("/").pop().replace(/\.html$/, ""); } catch (e) { return; }
    var hash = PAGES[name] ? "#" + name : "";
    if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);
    try { document.title = w.document.title; } catch (e) {}
    frame.focus(); // キーボード(ダイヤルの数字キーなど)がすぐ中のページに届くように
  });
})();
</script>
<script src="bgm.js?v=2"></script>
</body>
</html>
