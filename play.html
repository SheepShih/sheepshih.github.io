<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play | Shih TingFang 施婷方 | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bentham&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pc-deco.css?v=46">
<style>
  :root { --diner-bg: #DF9079; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--diner-bg);
    font-family: "Bentham", serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* topページのドア画像と同じサイズ・位置の枠(中にNOW SHOWINGの劇場ステージ) */
  .play-frame {
    position: relative;
    width: min(100vw, 430px);
    aspect-ratio: 768 / 1376;
    max-height: 100dvh;
    overflow: hidden;
    cursor: pointer; /* シーン全体をタップでトップへ戻れる(ボタンは非表示) */
  }

  .play-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- 登場演出: 赤いベルベットの幕が左右に開く ---------- */
  /* 読み込み中は幕が閉じた状態でシーンを隠し、画像の準備ができたら
     .curtain-open を付けて左右の袖へたぐり寄せる(折り目が縮んで束になる) */
  /* 幕の見た目は参考画像(閉幕した劇場ステージ)の幕から切り出したもの。
     curtain-drape.webp        = 幕の本体(飾り幕の下〜裾まで、中央にスポットライトの明るみ)
     curtain-drape-fringe.webp = 裾の金フリンジ(糸の隙間は透過)
     1枚の幕を左右の幕に半分ずつ割り当てる(背景サイズ200%で左半分/右半分を表示)ので、
     閉じているときは継ぎ目なく1枚の幕に見える。本体は縦に伸ばして枠の高さに合わせ、
     フリンジは横幅に対して元の縦横比のまま(445×46 → 枠高さの約5.3%) */
  .stage-curtain {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 51%; /* 中央で少し重ねて隙間を出さない */
    z-index: 2;
    pointer-events: none;
    background: url("assets/img/curtain-drape.webp?v=2") no-repeat left top / 200% 94.7%;
  }
  .stage-curtain::after { /* 裾の金フリンジ */
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5.3%;
    background: url("assets/img/curtain-drape-fringe.webp?v=2") no-repeat left top / 200% 100%;
  }
  .stage-curtain.right,
  .stage-curtain.right::after { background-position: right top; }
  .stage-curtain.left  { left: 0;  transform-origin: left center; }
  .stage-curtain.right { right: 0; transform-origin: right center; }
  /* 合わせ目にだけ、ほんのり影(開き始めに2枚の幕だと分かる程度) */
  .stage-curtain.left::before,
  .stage-curtain.right::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 5.3%;
    width: 6px;
    background: linear-gradient(to right, transparent, rgba(60, 0, 4, 0.35), transparent);
  }
  .stage-curtain.left::before  { right: 0; }
  .stage-curtain.right::before { left: 0; }

  .play-frame.curtain-open .stage-curtain.left  { animation: curtain-left  1.6s cubic-bezier(0.65, 0, 0.25, 1) 0.25s both; }
  .play-frame.curtain-open .stage-curtain.right { animation: curtain-right 1.6s cubic-bezier(0.65, 0, 0.25, 1) 0.25s both; }
  @keyframes curtain-left {
    0%   { transform: translateX(0)     scaleX(1); }
    70%  { transform: translateX(0)     scaleX(0.22); } /* 袖にたぐり寄せる */
    100% { transform: translateX(-110%) scaleX(0.22); } /* そのまま袖に引っ込む */
  }
  @keyframes curtain-right {
    0%   { transform: translateX(0)    scaleX(1); }
    70%  { transform: translateX(0)    scaleX(0.22); }
    100% { transform: translateX(110%) scaleX(0.22); }
  }
  /* ↑は縦帯に分けられない環境向けの簡易版。通常は下の「布の縦帯」版で動く */

  /* ---------- 布の縦帯で、アコーディオン状に折りたたみながら開く ----------
     JSで各幕を12本の帯(=ひだの面)に分け、1本おきに逆向きへ3D回転させて折り目を作る。
     折れは合わせ目から袖側へ伝わり、面の向きに応じて明暗が付く(位置は毎フレームJSで計算)
     .curtain-strip = ひだの面1枚(3D回転・位置)
     .curtain-sway  = 裾が遅れてついてくる揺れ(skewX、上端が起点)
     .curtain-cloth / .curtain-hem = その面に当たる部分の生地とフリンジ
       (背景サイズ = 2×12 = 2400% で、1枚の幕のうちその帯の位置だけを表示)
     .curtain-pleat = 面の丸みの陰影 / .curtain-tone = 面の向きによる明暗 */
  /* 遠近感(perspective)は付けない: 付けると奥へ折れた面が小さく描かれ、
     上端・下端に隙間が出る。折れ具合は面の幅と明暗で表現する */
  .stage-curtain.stripped {
    background: none;
  }
  .stage-curtain.stripped::before,
  .stage-curtain.stripped::after { display: none; }
  .play-frame.curtain-open .stage-curtain.stripped { animation: none; }
  .curtain-strip {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: calc(100% / 12);
    backface-visibility: hidden;
  }
  .stage-curtain.left  .curtain-strip { transform-origin: left center; }
  .stage-curtain.right .curtain-strip { transform-origin: right center; }
  /* 面の境目に隙間の線が出ないよう、生地とフリンジを右隣へ2pxはみ出させて重ねる
     (模様の位置はJSがピクセル単位で合わせる) */
  .curtain-strip .curtain-cloth,
  .curtain-strip .curtain-hem { right: -2px; }
  /* 裾が遅れて傾いたときに袖側の下端に隙間が出ないよう、いちばん外側の面は外へ延ばしておく */
  .stage-curtain.left  .curtain-strip.outer .curtain-cloth,
  .stage-curtain.left  .curtain-strip.outer .curtain-hem  { left: -30px; }
  .stage-curtain.right .curtain-strip.outer .curtain-cloth,
  .stage-curtain.right .curtain-strip.outer .curtain-hem  { right: -30px; }
  .curtain-tone {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 5.3%;
    opacity: 0;
  }
  .curtain-sway {
    position: absolute;
    inset: 0;
    transform-origin: 50% 0;
  }
  .curtain-cloth {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 94.7%;
    background: url("assets/img/curtain-drape.webp?v=2") no-repeat 0 0 / 2400% 100%;
  }
  .curtain-hem {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5.3%;
    background: url("assets/img/curtain-drape-fringe.webp?v=2") no-repeat 0 0 / 2400% 100%;
  }
  .curtain-pleat {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 5.3%;
    opacity: 0;
    background: linear-gradient(90deg,
      rgba(35, 0, 3, 0.7), rgba(35, 0, 3, 0.15) 30%,
      rgba(255, 190, 170, 0.14) 50%,
      rgba(35, 0, 3, 0.15) 70%, rgba(35, 0, 3, 0.7));
  }
  /* 合わせ目の端(先頭の帯)からステージへ落ちる影 */
  .stage-curtain.left  .curtain-strip.lead { box-shadow: 10px 0 18px -6px rgba(20, 0, 2, 0.45); }
  .stage-curtain.right .curtain-strip.lead { box-shadow: -10px 0 18px -6px rgba(20, 0, 2, 0.45); }

  /* ---------- 幕の向こうの劇場(背景)の演出 ----------
     .stage-scene = 背景画像と照明を重ねた層。幕が開くのに合わせて、ぼやけた状態から
     ピントが合い、客席の暗さから明るくなる(値は毎フレームJSで設定)
     .marquee-glow = NOW SHOWING の電球が灯る光(チカチカしてから点灯)
     .stage-spot   = スクリーンの光がふわっと広がる */
  .stage-scene {
    position: absolute;
    inset: 0;
  }
  .stage-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  .marquee-glow {
    background: radial-gradient(ellipse 50% 9.5% at 50% 12.5%,
      rgba(255, 214, 150, 0.95), rgba(255, 172, 95, 0.4) 55%, transparent 78%);
  }
  .stage-spot {
    background: radial-gradient(ellipse 46% 17% at 50% 51%,
      rgba(255, 246, 228, 0.95), rgba(255, 222, 185, 0.3) 58%, transparent 80%);
  }

  @media (prefers-reduced-motion: reduce) {
    .stage-curtain { display: none; }
  }
</style>
</head>
<body>

<div class="play-frame" id="playFrame" role="link" tabindex="0" aria-label="トップへ戻る">
  <div class="stage-scene">
    <img class="play-img" src="assets/img/play-theater.webp?v=2" alt="Shih TingFang Diner — Play: NOW SHOWING の劇場ステージ">
    <div class="stage-fx marquee-glow" aria-hidden="true"></div>
    <div class="stage-fx stage-spot" aria-hidden="true"></div>
  </div>
  <div class="stage-curtain left" aria-hidden="true"></div>
  <div class="stage-curtain right" aria-hidden="true"></div>
</div>

<!-- PC幅のみの装飾は pc-deco.js が注入する(index/about/works/play共通) -->
<script src="pc-deco.js?v=27"></script>

<script>
(function () {
  var frame = document.getElementById("playFrame");

  // 登場時に幕を開く。画像の準備ができてから開け、開ききったら幕の要素を外す
  var img = frame.querySelector(".play-img");
  var curtains = frame.querySelectorAll(".stage-curtain");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 幕をひだの面(縦帯)に分け、アコーディオン状に折りたたみながら開く。
  // 面は1枚おきに逆向きへ3D回転(=折り目)。折れは合わせ目から始まり、
  // 袖側の布は押されるまで平らなまま。各面の位置は折れ角から毎フレーム積み上げて求める
  var N = 12;                              // 片側の面の数(2面で1つのひだ)
  var GATHER_RATIO = 0.2;                  // 束ねたときの幅(元の幕幅に対する割合)
  var MAX_FOLD = Math.acos(GATHER_RATIO);  // 束ねた幅になる面の傾き(約78度)
  var START = 250;     // 開き始め(ms)
  var GATHER = 1500;   // 折りたたみにかける時間(ms)
  var SPREAD = 0.45;   // 袖側の面ほど遅れて折れ始める割合
  var SETTLE = 420;    // 折りきった後に裾が揺り戻す時間(ms)
  var EXIT = 700;      // 束ねた幕が袖へ引っ込む時間(ms)
  var EXIT_AT = START + GATHER - 150;
  var TOTAL = EXIT_AT + EXIT;
  var useStrips = !reduceMotion;
  var panels = [];

  function buildStrips(panel, side) {
    panel.classList.add("stripped");
    var list = [];
    for (var i = 0; i < N; i++) {
      var strip = document.createElement("div");
      strip.className = "curtain-strip";
      // 1枚の幕(左右合わせて2N本)のうち、この面の位置を背景から切り出す
      var idx = side === "left" ? i : N + i;
      var posX = (idx / (2 * N - 1) * 100) + "% 0";
      var k = side === "left" ? i : N - 1 - i; // 0 = 袖側の端, N-1 = 合わせ目(先頭)
      strip.dataset.idx = idx;
      strip.innerHTML =
        '<div class="curtain-sway">' +
        '<div class="curtain-cloth" style="background-position:' + posX + '"></div>' +
        '<div class="curtain-hem" style="background-position:' + posX + '"></div>' +
        '<div class="curtain-pleat"></div>' +
        // 奥を向く面は暗く、客席側(中央)を向く面はほんのり明るく
        '<div class="curtain-tone" style="background:' + (k % 2 === 0 ? "rgb(25,0,3)" : "rgb(255,205,185)") + '"></div>' +
        "</div>";
      if (k === 0) strip.classList.add("outer");
      panel.appendChild(strip);
      list[k] = strip;
    }
    panel.style.transformOrigin = "50% 0"; // 裾の遅れ(skew)は上端のレールを起点に
    panels.push({ el: panel, side: side, dir: side === "left" ? -1 : 1, strips: list });
  }

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function easeIn(p) { return p * p * p; }

  // 幕の向こうの劇場: 奥から寄る・灯る・看板が点く・スクリーンが光る
  var scene = frame.querySelector(".stage-scene");
  var marquee = frame.querySelector(".marquee-glow");
  var spot = frame.querySelector(".stage-spot");
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  // 看板の電球: [時刻(ms, 開き始めから), 明るさ] を順につなぐ(チカッ、チカッ、パッと点灯)
  var MARQUEE_KEYS = [[250, 0], [300, 0.85], [340, 0.1], [410, 0.7], [440, 0.15], [520, 0.95], [900, 0.6], [1800, 0.3]];
  function marqueeLevel(t) {
    var r = t - START;
    if (r <= MARQUEE_KEYS[0][0]) return 0;
    for (var i = 1; i < MARQUEE_KEYS.length; i++) {
      var a = MARQUEE_KEYS[i - 1], b = MARQUEE_KEYS[i];
      if (r <= b[0]) return a[1] + (b[1] - a[1]) * ((r - a[0]) / (b[0] - a[0]));
    }
    return MARQUEE_KEYS[MARQUEE_KEYS.length - 1][1];
  }
  var sceneImg = scene.querySelector(".play-img");
  function renderScene(t) {
    var blur = 4 * (1 - easeOut(span(t, START + 200, START + 1400)));          // ぼけ → ピント
    var light = 0.3 + 0.7 * easeInOut(span(t, START + 200, START + 1700));      // 暗い → 明るい
    // 暗さ・ぼかしは劇場の画像だけに(看板やスクリーンの光は暗くしない)
    sceneImg.style.filter = "brightness(" + light + ")" + (blur > 0.05 ? " blur(" + blur + "px)" : "");
    marquee.style.opacity = marqueeLevel(t);
    spot.style.opacity = t < START + 1200
      ? 0.55 * easeInOut(span(t, START + 300, START + 1200))
      : 0.55 - 0.35 * span(t, START + 1200, TOTAL);
  }

  // 時刻 t(ms) の幕の形を描く
  function render(t) {
    renderScene(t);
    var foldDur = GATHER * (1 - SPREAD);
    panels.forEach(function (P) {
      var w = P.el.clientWidth / N;
      var x = 0, z = 0; // 袖側の端から見た、次の面の付け根の位置
      for (var k = 0; k < N; k++) {
        var t0 = START + ((N - 1 - k) / (N - 1)) * GATHER * SPREAD;
        var raw = clamp01((t - t0) / foldDur);
        var p = easeInOut(raw);
        var a = p * MAX_FOLD * (k % 2 === 0 ? 1 : -1);
        var strip = P.strips[k];
        var left = P.side === "left" ? x : (N - 1) * w - x;
        strip.style.transform = "translate3d(" + left + "px,0," + z + "px) rotateY(" +
          (P.side === "left" ? a : -a) + "rad)";
        x += w * Math.cos(a);
        z -= w * Math.sin(a);
        // 面の向きによる明暗と、ひだの丸みの陰影
        var f = Math.sin(Math.abs(a));
        strip.lastChild.lastChild.style.opacity = (k % 2 === 0 ? 0.85 : 0.35) * f;
        strip.lastChild.children[2].style.opacity = 0.7 * f;
      }
      // 裾は上のレールより遅れてついてきて、折りきった後に小さく揺り戻す
      // (面ごとに角度を変えると下端に段差が出るので、幕全体に同じ傾きをかける)
      var leadT0 = START, leadRaw = clamp01((t - leadT0) / foldDur);
      var amp = -P.dir * 2.5;
      var skew = leadRaw < 1 ? amp * Math.sin(Math.PI * easeInOut(leadRaw))
                             : -0.35 * amp * Math.sin(Math.PI * clamp01((t - leadT0 - foldDur) / SETTLE));
      // 束ねた幕ごと袖へ引っ込む
      P.el.style.transform = "translateX(" + (P.dir * 115 * easeIn(clamp01((t - EXIT_AT) / EXIT))) + "%) skewX(" + skew + "deg)";
    });
  }

  // 生地の模様を面の幅(px)に合わせて切り出す(はみ出した2pxにも隣の模様が続くように)
  function layoutTextures() {
    panels.forEach(function (P) {
      var w = P.el.clientWidth / N;
      P.strips.forEach(function (strip) {
        // 左幕の外側の面は左へ30px延ばしてあるので、その分だけ模様をずらす
        var shift = (P.side === "left" && strip.classList.contains("outer")) ? 30 : 0;
        var off = (-strip.dataset.idx * w + shift) + "px 0";
        var size = (2 * N * w) + "px 100%";
        var layers = strip.firstChild.children; // cloth, hem
        for (var i = 0; i < 2; i++) {
          layers[i].style.backgroundSize = size;
          layers[i].style.backgroundPosition = off;
          layers[i].style.backgroundRepeat = "repeat-x"; // 延ばした部分にも生地が続くように
        }
      });
    });
  }

  if (useStrips) {
    buildStrips(curtains[0], "left");
    buildStrips(curtains[1], "right");
    layoutTextures();
    render(0);
    window.addEventListener("resize", function () {
      layoutTextures();
      if (!frame.classList.contains("curtain-open")) render(0);
    });
  }

  // 確認用: URLに #curtain-debug を付けると window.__curtainAt(ms) でその瞬間の形に止められる
  var frozen = null;
  if (location.hash === "#curtain-debug") {
    window.__curtainAt = function (t) { frozen = t; render(t); };
  }

  function animateStrips() {
    panels.forEach(function (P) { P.strips[N - 1].classList.add("lead"); });
    var begin = performance.now(), finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      for (var j = 0; j < curtains.length; j++) curtains[j].remove();
      // 開ききったら、スクリーンの光は余韻を残して消え、看板はほんのり灯ったまま
      sceneImg.style.filter = "";
      spot.style.transition = "opacity 1.2s ease";
      spot.style.opacity = 0;
    }
    function tick() {
      if (finished) return;
      if (frozen !== null) { next(); return; }
      var t = performance.now() - begin;
      render(Math.min(t, TOTAL));
      if (t >= TOTAL) finish(); else next();
    }
    // rAFが止まる環境(裏タブ等)でもタイマーで進める
    function next() {
      var ran = false;
      var run = function () { if (!ran) { ran = true; tick(); } };
      requestAnimationFrame(run);
      setTimeout(run, 50);
    }
    next();
  }

  var opened = false;
  function openCurtain() {
    if (opened) return;
    opened = true;
    if (!useStrips) {
      curtains[1].addEventListener("animationend", function () {
        for (var i = 0; i < curtains.length; i++) curtains[i].remove();
      }, { once: true });
    }
    // 閉じた状態を一瞬見せてから開ける(キャッシュ済みでも演出が見えるように)。
    // rAFが止まる環境(裏タブ等)でも確実に開くよう、タイマーを併用する
    var go = function () {
      if (frame.classList.contains("curtain-open")) return;
      frame.classList.add("curtain-open"); // ステージの照明が灯る(簡易版ではこれで幕も開く)
      if (useStrips) animateStrips();
    };
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 120);
  }
  if (img.complete && img.naturalWidth > 0) { openCurtain(); }
  else {
    img.addEventListener("load", openCurtain, { once: true });
    img.addEventListener("error", openCurtain, { once: true });
  }
  setTimeout(openCurtain, 4000); // 読み込みが遅くても幕が閉じたままにならないように

  var goHome = function () { window.location.href = "index.html"; };
  frame.addEventListener("click", goHome);
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
  });
})();
</script>
</body>
</html>
